[workspace]
resolver = "2"
members = [
  "packages/runtime_server",
  "packages/hosted_execution",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.94.1"
license = "AGPL-3.0-only"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
await_holding_lock = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
axum = { version = "=0.8.9", default-features = false }
base64 = "=0.22.1"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
futures = "=0.3.32"
hmac = "=0.12.1"
hyper = { version = "=1.10.1", default-features = false }
hyper-util = { version = "=0.1.20", default-features = false }
libc = "=0.2.186"
postgres = "=0.19.14"
redis = "=0.27.6"
reqwest = { version = "=0.12.28", default-features = false }
rmcp = { version = "=3.1.4", default-features = false, features = ["client", "reqwest", "transport-child-process", "transport-streamable-http-client-reqwest"] }
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
tokio = "=1.52.3"
unicode-normalization = "=0.1.25"
zstd = "=0.13.3"

[workspace.dependencies.centaeris-core]
path = "../centaeris/packages/core"

[workspace.dependencies.centaeris-model-catalog]
path = "../centaeris/packages/model-catalog"

[workspace.dependencies.centaeris-mcp]
path = "../centaeris/packages/mcp"

[workspace.dependencies.centaeris-runtime-sqlite]
path = "../centaeris/packages/runtime_sqlite"
